version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # חיבור למסד הנתונים postgres שעל שרת המארח דרך הרשת של דוקר
      # שימו לב: קידדנו את ה-@ שבסיסמה ל-%40
      - DATABASE_URL=postgresql://postgres:bartar20%40CS@host.docker.internal:5432/momentum
      - PORT=3000
      - NODE_ENV=production
      # השתמשו במשתנים אלו כדי להעביר את הסודות בבטחה, רצוי ע"י יצירת קובץ .env לצד הקובץ הזה בשרת
      - JWT_SECRET=${JWT_SECRET:-momentum-super-secret-jwt-key-change-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BOT_TOKEN=${BOT_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # מיפוי תעודות ה-SSL מהשרת אל תוך קונטיינר ה-Nginx לקריאה בלבד
      - /etc/ssl/cs:/etc/ssl/cs:ro
    depends_on:
      - backend
    restart: unless-stopped
