server {
    listen 80;
    server_name momentum.cs.colman.ac.il;
    
    # הפניית בקשות HTTP ל-HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name momentum.cs.colman.ac.il;

    # נתיבי ה-SSL (יש לוודא שהשמות תואמים לקבצים הקיימים בשרת שלך בתיקייה /etc/ssl/cs/)
    ssl_certificate /etc/ssl/cs/CSB.crt;
    ssl_certificate_key /etc/ssl/cs/myserver.key;

    # הגדרות אבטחה בסיסיות ל-SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # תמיכה ב-React Router / SPA - ניתוב הכל לקובץ אינדקס
        try_files $uri $uri/ /index.html;
    }

    # הפניית בקשות ה-API לשרת ה-Backend
    location /api/ {
        # חשוב: שרת ה-backend פועל על פורט 3000 והנתיבים בו מתחילים גם הם ב-/api/
        proxy_pass http://backend:3000/api/;
        
        # שמירת כתובות מקור של לקוחות 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
