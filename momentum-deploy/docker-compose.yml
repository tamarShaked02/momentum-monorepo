services:
  backend:
    image: shulshuk/momentum-backend:1.0.0
    environment:
      - DATABASE_URL=postgresql://postgres:bartar20%40CS@host.docker.internal:5432/momentum
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=<enter_token>
      - GEMINI_API_KEY=<enter_token>
      - BOT_TOKEN=<enter_token>
      - GOOGLE_CLIENT_ID=<enter_token>
      - GOOGLE_CLIENT_SECRET=<enter_token>
      - GOOGLE_REDIRECT_URI=https://momentum.cs.colman.ac.il/api/google-calendar/callback
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cs:/etc/ssl/cs:ro
    depends_on:
      - frontend
      - backend

  frontend:
    image: shulshuk/momentum-frontend:1.0.0
    depends_on:
      - backend
    restart: unless-stopped
